
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Portfolio | Estudiante DAM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fff5f8;
            color: #333;
        }

        /* CABECERA */

        header {
            background-color: #f7b6ca;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }

        header h1 {
            color: #ffffff;
            font-size: 28px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #7d3853;
        }

        /* PRESENTACIÓN */

        .inicio {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .inicio-contenido {
            max-width: 750px;
        }

        .inicio h2 {
            font-size: 50px;
            color: #d45d87;
            margin-bottom: 15px;
        }

        .inicio h3 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .inicio p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .boton {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 30px;
            background-color: #d45d87;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .boton:hover {
            background-color: #b9436d;
        }

        /* SECCIONES */

        section {
            padding: 70px 10%;
        }

        section h2 {
            text-align: center;
            color: #d45d87;
            font-size: 35px;
            margin-bottom: 40px;
        }

        /* SOBRE MÍ */

        .sobre-mi {
            background-color: white;
        }

        .sobre-mi-contenido {
            max-width: 850px;
            margin: auto;
            text-align: center;
            line-height: 1.8;
            font-size: 17px;
        }

        /* HABILIDADES */

        .habilidades {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .habilidad {
            background-color: white;
            width: 200px;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .habilidad h3 {
            color: #d45d87;
            margin-bottom: 10px;
        }

        /* PROYECTOS */

        .proyectos {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .proyecto {
            background-color: white;
            width: 300px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .proyecto h3 {
            color: #d45d87;
            margin-bottom: 15px;
        }

        .proyecto p {
            line-height: 1.6;
            color: #555;
        }

        /* ESTUDIOS */

        .estudios {
            background-color: white;
        }

        .estudio {
            max-width: 750px;
            margin: 20px auto;
            padding: 20px;
            border-left: 5px solid #d45d87;
            background-color: #fff5f8;
        }

        .estudio h3 {
            color: #d45d87;
            margin-bottom: 8px;
        }
